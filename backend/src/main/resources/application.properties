spring.application.name=university-fee-management
server.port=${PORT:8080}

# Primary Data Source (H2 configured in MySQL compatibility mode for seamless plug-and-play execution)
spring.datasource.url=jdbc:h2:mem:university_fee_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable automatic SQL script runner (Hibernate DDL & DataInitializer handle table creation & seeding)
spring.sql.init.mode=never

# For Real MySQL instance, toggle the following:
# spring.datasource.url=jdbc:mysql://localhost:3306/university_fee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=9a6747f3b97856bc614231f895e25b0c7c45fda117c2b5e3c4e56789abcdef0123456789abcdef0123456789abcdef0123456789abcdef01
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.university.feems=INFO
logging.level.org.springframework.security=WARN
